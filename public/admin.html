<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة إدارة اختباري</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner admin-top">
    <div><h1>لوحة إدارة اختباري</h1><p>إنشاء وإدارة تراخيص المعلمين</p></div>
    <button id="adminLogoutBtn" class="btn danger">تسجيل خروج</button>
  </div>
</header>

<main class="container">
  <section class="card">
    <div class="section-title">
      <h2>إضافة معلم جديد</h2>
      <p>سيُنشئ النظام رقم ترخيص مستقل للمعلم.</p>
    </div>

    <form id="createTeacherForm" class="form-grid">
      <div class="field"><label>اسم المعلم</label><input id="teacherName" required></div>
      <div class="field"><label>كلمة المرور الأولية</label><input id="teacherPassword" type="text" minlength="6" required></div>
      <div class="field"><label>تاريخ انتهاء الترخيص - اختياري</label><input id="expiresAt" type="date"></div>
      <div class="field admin-create-button"><button class="btn primary" type="submit">+ إنشاء الترخيص</button></div>
    </form>
    <div id="adminMessage" class="account-save-status"></div>
  </section>

  <section class="card">
    <div class="questions-header">
      <div><h2>المعلمون</h2><p>كل معلم مستقل ببياناته واختباراته.</p></div>
      <div class="question-count"><span id="teacherCount">0</span> معلم</div>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>المعلم</th><th>رقم الترخيص</th><th>الحالة</th><th>الانتهاء</th><th>الاختبارات</th><th>الإجراءات</th></tr></thead>
        <tbody id="teachersTableBody"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="admin.js"></script>
</body>
</html>
