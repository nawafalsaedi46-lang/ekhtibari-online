<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>سجل المتابعة - اختباري</title>

<link rel="stylesheet" href="/followup.css">

</head>

<body>

<div class="register-app no-print">

  <header class="register-top">

    <div>
      <a href="/dashboard" class="back-btn">
        ← الرئيسية
      </a>

      <h1>📒 سجل متابعة الطلاب</h1>

      <p>
        أنشئ سجل الفصل واطبعه، ثم استخدمه ورقيًا طوال الأسبوع.
      </p>
    </div>

    <div class="teacher-box">
      <span>المعلم</span>
      <strong id="teacherName">...</strong>
    </div>

  </header>


  <section class="register-card">

    <div class="section-heading">
      <div>
        <h2>بيانات السجل</h2>
        <p>تظهر هذه البيانات تلقائيًا في ورقة الطباعة.</p>
      </div>

      <span id="saveStatus" class="save-status">
        محفوظ
      </span>
    </div>


    <div class="class-row">

      <div class="field grow">
        <label>اسم الفصل الجديد</label>

        <input
          id="newClassName"
          type="text"
          placeholder="مثال: الرابع ابتدائي - أ"
        >
      </div>

      <button
        type="button"
        id="createClassBtn"
        class="primary-btn"
      >
        + إنشاء الفصل
      </button>


      <div class="field">
        <label>الفصل المحفوظ</label>

        <select id="classSelect">
          <option value="">اختر الفصل</option>
        </select>
      </div>

      <button
        type="button"
        id="deleteClassBtn"
        class="danger-btn"
      >
        حذف الفصل
      </button>

    </div>


    <div class="data-grid">

      <div class="field">
        <label>الإدارة التعليمية</label>
        <input id="administration" placeholder="الإدارة التعليمية">
      </div>

      <div class="field">
        <label>اسم المدرسة</label>
        <input id="school" placeholder="اسم المدرسة">
      </div>

      <div class="field">
        <label>العام الدراسي</label>
        <input id="academicYear" placeholder="1448 هـ">
      </div>

      <div class="field">
        <label>الصف</label>
        <input id="grade" placeholder="الرابع ابتدائي">
      </div>

      <div class="field">
        <label>الفصل الدراسي</label>
        <input id="semester" placeholder="الفصل الأول">
      </div>

      <div class="field">
        <label>الأسبوع</label>
        <input id="week" placeholder="الأسبوع الأول">
      </div>

      <div class="field">
        <label>المادة / المقرر</label>
        <input id="subject" placeholder="الدراسات الإسلامية">
      </div>

      <div class="field">
        <label>تصميم السجل</label>

        <select id="registerDesign">
          <option value="weekly">
            التصميم 1 — أسبوعي عمودي
          </option>

          <option value="performance">
            التصميم 2 — أفقي احترافي
          </option>
        </select>
      </div>

    </div>

  </section>


  <section class="register-card">

    <div class="section-heading">

      <div>
        <h2>أسماء الطلاب</h2>
        <p>
          اكتب كل طالب في سطر مستقل. تحفظ الأسماء مع الفصل.
        </p>
      </div>

      <strong id="studentCount">0 طالب</strong>

    </div>

    <textarea
      id="studentsInput"
      class="students-input"
      placeholder="محمد أحمد علي&#10;خالد عبدالله سالم&#10;سعد محمد أحمد"
    ></textarea>


    <div class="action-row">

      <button
        type="button"
        id="saveBtn"
        class="primary-btn"
      >
        💾 حفظ البيانات
      </button>

      <button
        type="button"
        id="printBtn"
        class="print-btn"
      >
        🖨️ طباعة السجل
      </button>

    </div>

  </section>


  <section class="preview-section">

    <div class="preview-title">
      معاينة السجل
    </div>

    <div class="preview-stage">

      <div
        id="printPreview"
        class="print-preview"
      ></div>

    </div>

  </section>

</div>


<style id="followupDynamicPrintStyle"></style>

<script src="/followup.js"></script>

</body>
</html>
