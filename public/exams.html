<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختباراتي - اختباري</title>
<link rel="stylesheet" href="/dashboard.css">
<style>
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f8fc;color:#152238}
.page{max-width:1000px;margin:auto;padding:30px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.head h1{margin:0}
.btn{background:#1769e8;color:white;text-decoration:none;padding:12px 18px;border-radius:10px}
.card{background:white;border:1px solid #e8edf4;border-radius:18px;padding:22px}
.exam{display:flex;align-items:center;gap:15px;border:1px solid #e8edf4;border-radius:14px;padding:16px;margin-bottom:12px}
.info{flex:1}
.info strong{display:block;margin-bottom:6px}
.info span{font-size:12px;color:#8995a7}
.actions{display:flex;gap:8px}
.open,.delete{border:0;border-radius:9px;padding:9px 15px;text-decoration:none;font-family:inherit;cursor:pointer}
.open{background:#1769e8;color:white}
.delete{background:#fff0f0;color:#c62828}
.toplinks{margin-bottom:20px;display:flex;gap:10px}
.toplinks a{text-decoration:none;color:#1769e8}
.empty{text-align:center;padding:30px;color:#8995a7}
@media(max-width:700px){
.page{padding:18px}
.head{align-items:flex-start;flex-direction:column;gap:15px}
.exam{flex-wrap:wrap}
.actions{width:100%}
.actions a,.actions button{flex:1;text-align:center}
}
</style>
</head>

<body>

<div class="page">

<div class="toplinks">
<a href="/dashboard">← الرجوع للرئيسية</a>
</div>

<div class="head">
<div>
<h1>📁 اختباراتي</h1>
<p>جميع الاختبارات التي حفظتها باسمك الخاص.</p>
</div>

<a class="btn" href="/teacher">+ إنشاء اختبار جديد</a>
</div>

<div class="card">
<div id="examList" class="empty">جاري تحميل اختباراتك...</div>
</div>

</div>

<script src="/exams.js"></script>
</body>
</html>
